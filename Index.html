<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skeet Lövészet 2D</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; overflow: hidden; font-family: sans-serif; touch-action: manipulation; }
        #gameCanvas { background: linear-gradient(to bottom, #87CEEB 60%, #556B2F 40%); display: block; margin: 0 auto; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); }
    </style>
</head>
<body>
<div id="ui">Pontszám: <span id="score">0</span> | Lőszer: <span id="ammo">2</span></div>
<canvas id="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const ammoEl = document.getElementById('ammo');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let score = 0, ammo = 2, targets = [], pellets = [];
    class Target {
        constructor() {
            this.x = Math.random() < 0.5 ? 0 : canvas.width;
            this.y = canvas.height * 0.6;
            this.radius = 12;
            this.vx = (this.x === 0 ? 1 : -1) * (Math.random() * 4 + 6);
            this.vy = -(Math.random() * 3 + 8);
            this.gravity = 0.15;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FF5722';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.stroke();
            ctx.closePath();
        }
    }
    function shoot(targetX, targetY) {
        if (ammo <= 0) return;
        ammo--;
        ammoEl.innerText = ammo;
        for (let i = 0; i < 12; i++) {
            pellets.push({ x: targetX + (Math.random() - 0.5) * 40, y: targetY + (Math.random() - 0.5) * 40, radius: 3, alpha: 1 });
        }
        targets.forEach((target, index) => {
            if (Math.hypot(target.x - targetX, target.y - targetY) < target.radius + 25) {
                score += 10;
                scoreEl.innerText = score;
                targets.splice(index, 1);
            }
        });
        if (ammo === 0) {
            setTimeout(() => { ammo = 2; ammoEl.innerText = ammo; }, 1500);
        }
    }
    setInterval(() => { if (targets.length < 2) targets.push(new Target()); }, 2500);
    window.addEventListener('touchstart', (e) => { shoot(e.touches[0].clientX, e.touches[0].clientY); });
    window.addEventListener('click', (e) => { shoot(e.clientX, e.clientY); });
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        targets.forEach((target, index) => {
            target.update(); target.draw();
            if (target.y > canvas.height) targets.splice(index, 1);
        });
        pellets.forEach((pellet, index) => {
            ctx.beginPath();
            ctx.arc(pellet.x, pellet.y, pellet.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 0, ${pellet.alpha})`;
            ctx.fill();
            pellet.alpha -= 0.05;
            if (pellet.alpha <= 0) pellets.splice(index, 1);
        });
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
